<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de Seguimiento</title>
</head>
<body>
  <h2>Gracias por tu reseña. Por favor, completa tus datos:</h2>
  <form action="procesar_formulario.php" method="post">
    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" name="nombre" required><br><br>

    <label for="numero">Número:</label><br>
    <input type="tel" id="numero" name="numero" required><br><br>

    <label for="repaso">Comentario adicional:</label><br>
    <textarea id="repaso" name="repaso" rows="4" required></textarea><br><br>

    <button type="submit">Enviar</button>
  </form>
</body>
</html>
