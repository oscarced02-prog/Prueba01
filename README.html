<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Reseñas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f9f9f9;
    }
    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
    }
    h2 { 
      text-align: center; 
      font-size: 22px;
    }
    .stars {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 20px 0;
      cursor: pointer;
      flex-wrap: wrap;
    }
    .star {
      font-size: 40px;
      color: #ccc;
      transition: transform 0.2s;
    }
    .star.selected {
      color: gold;
      transform: scale(1.2);
    }
    textarea {
      width: 100%;
      height: 100px;
      resize: none;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #007bff;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0056b3;
    }

    /* Responsive para móviles */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .container {
        padding: 15px;
      }
      .star {
        font-size: 36px;
      }
      textarea {
        font-size: 14px;
      }
      button {
        font-size: 16px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Deja tu reseña</h2>
    <div class="stars" id="stars">
      <span class="star" data-value="1">★</span>
      <span class="star" data-value="2">★</span>
      <span class="star" data-value="3">★</span>
      <span class="star" data-value="4">★</span>
      <span class="star" data-value="5">★</span>
    </div>
    <textarea id="comentario" placeholder="Escribe tu comentario..."></textarea>
    <button onclick="enviarResena()">Enviar</button>
  </div>

  <script>
    let estrellasSeleccionadas = 0;
    const stars = document.querySelectorAll(".star");

    stars.forEach(star => {
      star.addEventListener("click", () => {
        estrellasSeleccionadas = parseInt(star.getAttribute("data-value"));
        updateStars(estrellasSeleccionadas);
      });
    });

    function updateStars(count) {
      stars.forEach(star => {
        star.classList.toggle("selected", parseInt(star.getAttribute("data-value")) <= count);
      });
    }

    function enviarResena() {
      const comentario = document.getElementById("comentario").value.trim();

      if (estrellasSeleccionadas === 0) {
        alert("Por favor selecciona una calificación.");
        return;
      }

      const review = {
        estrellas: estrellasSeleccionadas,
        comentario: comentario,
        fecha: new Date().toISOString()
      };

      // Simulación de lógica de envío
      if (review.estrellas >= 4) {
        console.log("✅ Reseña pública:", review);
        alert("¡Gracias! Serás redirigido a Google para compartir tu reseña pública.");
        window.location.href = "https://g.page/r/TU-LINK-DE-GOOGLE"; // <- reemplaza con tu link real
      } else {
        console.log("🔒 Reseña privada:", review);
        alert("Gracias por tu comentario, lo tomaremos en cuenta internamente.");
      }
    }
  </script>
</body>
</html>
