<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de Reseñas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f9f9f9;
    }
    .container {
      max-width: 400px;
      margin: auto;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; }
    .stars {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin: 15px 0;
      cursor: pointer;
    }
    .star {
      font-size: 32px;
      color: #ccc;
    }
    .star.selected {
      color: gold;
    }
    textarea {
      width: 100%;
      height: 80px;
      resize: none;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Deja tu reseña</h2>
    <div class="stars" id="stars">
      <span class="star" data-value="1">★</span>
      <span class="star" data-value="2">★</span>
      <span class="star" data-value="3">★</span>
      <span class="star" data-value="4">★</span>
      <span class="star" data-value="5">★</span>
    </div>
    <textarea id="comentario" placeholder="Escribe tu comentario..."></textarea>
    <button onclick="enviarResena()">Enviar</button>
  </div>

  <script>
    let estrellasSeleccionadas = 0;
    const stars = document.querySelectorAll(".star");

    stars.forEach(star => {
      star.addEventListener("click", () => {
        estrellasSeleccionadas = parseInt(star.getAttribute("data-value"));
        updateStars(estrellasSeleccionadas);
      });
    });

    function updateStars(count) {
      stars.forEach(star => {
        star.classList.toggle("selected", parseInt(star.getAttribute("data-value")) <= count);
      });
    }

    function enviarResena() {
      const comentario = document.getElementById("comentario").value;

      if (estrellasSeleccionadas === 0) {
        alert("Por favor selecciona una calificación.");
        return;
      }

      const review = {
        estrellas: estrellasSeleccionadas,
        comentario: comentario,
        fecha: new Date().toISOString()
      };

      // Aquí simulamos guardar en DB
      if (review.estrellas >= 4) {
        console.log("✅ Reseña pública:", review);
        alert("¡Gracias! Serás redirigido a Google para compartir tu reseña pública.");
        window.location.href = "https://g.page/r/TU-LINK-DE-GOOGLE"; // <- reemplaza con tu link real
      } else {
        console.log("🔒 Reseña privada:", review);
        alert("Gracias por tu comentario, lo tomaremos en cuenta internamente.");
      }
    }
  </script>
</body>
</html>
